<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    .tab-active { border-bottom: 3px solid #4f46e5; color: #4f46e5; font-weight: 700; }
    .btn-nav { @apply bg-white p-3 rounded-xl shadow-sm border border-slate-200 active:scale-95 transition-all; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-10">
  <div class="max-w-md mx-auto px-4 pt-6">
    
    <div class="mb-6">
      <div class="flex justify-between items-center mb-4">
        <h1 class="text-xl font-bold italic text-indigo-900">MAO Dashboard</h1>
        <button onclick="refreshData()" class="text-indigo-600 font-bold text-sm">Refresh</button>
      </div>
      
      <div class="flex items-center justify-between bg-white p-2 rounded-2xl shadow-sm border border-slate-100">
        <button onclick="changeDate(-1)" class="p-2 hover:bg-slate-50 rounded-lg text-indigo-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
        <div class="text-center">
          <p id="current-date" class="font-bold text-sm text-slate-800 tracking-tight">Memuat...</p>
        </div>
        <button onclick="changeDate(1)" class="p-2 hover:bg-slate-50 rounded-lg text-indigo-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>
    </div>

    <div class="bg-indigo-600 rounded-3xl p-6 text-white shadow-xl shadow-indigo-100 mb-6">
      <p class="text-indigo-100 text-[10px] font-bold uppercase tracking-widest">Total Omset</p>
      <h2 id="grand-total" class="text-3xl font-bold mt-1">Rp 0</h2>
    </div>

    <div class="flex border-b border-slate-200 mb-6 bg-white rounded-t-2xl">
      <button id="tab-omset-btn" onclick="switchTab('omset')" class="flex-1 py-4 text-sm tab-active">Omset</button>
      <button id="tab-detail-btn" onclick="switchTab('detail')" class="flex-1 py-4 text-sm text-slate-400">Stok</button>
    </div>

    <div id="view-omset" class="space-y-3"></div>
    <div id="view-detail" class="hidden space-y-4"></div>

  </div>

  <script>
    // --- KONFIGURASI ---
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwaezgcMKGAdN3q-sjV5Km0yI0DtCur2C8JJ2nfQVT-uLsMZL3xeF7CRIx0ny6ZlsUZ/exec"; 
    let currentViewingDate = new Date().getDate();

    function formatCurrency(num) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
    }

    function changeDate(step) {
      currentViewingDate += step;
      if (currentViewingDate < 1) currentViewingDate = 1;
      if (currentViewingDate > 31) currentViewingDate = 31;
      loadData(currentViewingDate);
    }

    function refreshData() {
      loadData(currentViewingDate);
    }

    function switchTab(tab) {
      const vO = document.getElementById('view-omset');
      const vD = document.getElementById('view-detail');
      const bO = document.getElementById('tab-omset-btn');
      const bD = document.getElementById('tab-detail-btn');
      if (tab === 'omset') {
        vO.classList.remove('hidden'); vD.classList.add('hidden');
        bO.className = 'flex-1 py-4 text-sm tab-active'; bD.className = 'flex-1 py-4 text-sm text-slate-400';
      } else {
        vO.classList.add('hidden'); vD.classList.remove('hidden');
        bO.className = 'flex-1 py-4 text-sm text-slate-400'; bD.className = 'flex-1 py-4 text-sm tab-active';
      }
    }

    function loadData(date) {
      const dateDisplay = document.getElementById('current-date');
      dateDisplay.innerText = "Mencari data...";
      
      fetch(`${WEB_APP_URL}?date=${date}`)
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            document.getElementById('view-omset').innerHTML = `<div class="bg-red-50 p-6 rounded-2xl text-red-600 text-center text-xs font-bold">${data.error}</div>`;
            dateDisplay.innerText = "Data tidak ada";
            return;
          }

          dateDisplay.innerText = data.date;
          
          // Render Omset
          const omsetContainer = document.getElementById('view-omset');
          omsetContainer.innerHTML = '';
          const outlets = [
            {n:"RS Waled", v:data.omset.RSWaled}, {n:"Leuweung Gajah", v:data.omset.LeuweungGajah},
            {n:"Babakan", v:data.omset.Babakan}, {n:"Tempura", v:data.omset.Tempura},
            {n:"Serba Mercon", v:data.omset.SerbaMercon}
          ];
          
          let total = 0;
          outlets.forEach(o => {
            total += (o.v || 0);
            omsetContainer.innerHTML += `
              <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
                <span class="font-semibold text-slate-600 text-sm">${o.n}</span>
                <span class="font-bold text-slate-900">${formatCurrency(o.v || 0)}</span>
              </div>`;
          });
          document.getElementById('grand-total').innerText = formatCurrency(total);

          // Render Detail Stok
          const detailContainer = document.getElementById('view-detail');
          detailContainer.innerHTML = renderGrid("Wonton - Leuweung", data.produk.leuweung) + 
                                     renderGrid("Wonton - Babakan", data.produk.babakan) +
                                     renderTempura(data.produk.tempura);
        });
    }

    function renderGrid(title, obj) {
      const items = [
        {l:'Wonton', v:obj.wonton}, {l:'Mie', v:obj.mie}, {l:'Baso', v:obj.baso}, 
        {l:'Creamy', v:obj.creamy}, {l:'Cirawang', v:obj.cirawang}, 
        {l:'Balungan', v:obj.balungan}, {l:'Pilus', v:obj.pilus}
      ];
      return `
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden mb-4">
          <div class="bg-slate-800 px-4 py-2 text-[10px] font-bold text-white uppercase">${title}</div>
          <div class="p-3 grid grid-cols-3 gap-2">
            ${items.map(i => `<div class="bg-slate-50 p-2 rounded-xl border border-slate-100"><p class="text-[9px] text-slate-400 font-bold uppercase">${i.l}</p><p class="font-bold text-sm text-slate-800">${i.v || 0}</p></div>`).join('')}
          </div>
        </div>`;
    }

    function renderTempura(obj) {
      const items = [{l:'1K', v:obj['1k']}, {l:'1.5K', v:obj['1_5k']}, {l:'2K', v:obj['2k']}, {l:'2.5K', v:obj['2_5k']}, {l:'3K', v:obj['3k']}, {l:'5K', v:obj['5k']}];
      return `
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
          <div class="bg-slate-800 px-4 py-2 text-[10px] font-bold text-white uppercase">Tempura</div>
          <div class="p-3 grid grid-cols-3 gap-2">
            ${items.map(i => `<div class="bg-slate-50 p-2 rounded-xl border border-slate-100"><p class="text-[9px] text-slate-400 font-bold uppercase">${i.l}</p><p class="font-bold text-sm text-slate-800">${i.v || 0}</p></div>`).join('')}
          </div>
        </div>`;
    }

    window.onload = () => loadData(currentViewingDate);
  </script>
</body>
</html>
